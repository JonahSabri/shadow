version: "3.9"

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./api/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # این‌ها زمان build داخل باندل جاسازی می‌شوند و باید آدرس عمومیِ واقعی سایت باشند
        - NEXT_PUBLIC_API_URL=https://zaminchand.com/api
        - NEXT_PUBLIC_SITE_URL=https://zaminchand.com
        - NEXT_PUBLIC_BRAND=املاک شمال
    ports:
      - "3001:3000"
    environment:
      # فقط برای fetch سمت سرور (SSR) استفاده می‌شود، در مرورگر دیده نمی‌شود
      - API_INTERNAL_URL=http://api:8001
    depends_on:
      - api
    restart: unless-stopped
